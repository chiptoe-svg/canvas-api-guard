# canvas-api-guard: the three Codex settings the guard relies on. install.sh adds any of
# them that ~/.codex/config.toml lacks and reports, but keeps, one set differently.

# Commands run in a sandbox with NO network. The shipped rule allows only the absolute,
# root-owned guard path to leave it for Canvas reads; writes always prompt a person.
sandbox_mode       = "workspace-write"

# Approvals are interactive: Codex stops and asks.
approval_policy    = "on-request"

# A PERSON answers every prompt. The alternative, "auto_review", lets a reviewer
# model approve on your behalf - including a Canvas write that missed the rules.
# This is the line that matters most.
approvals_reviewer = "user"
